name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    env:
      # необязательно: добавьте секрет NUGET_API_KEY, и на теге SDK уйдёт на nuget.org
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: choco install innosetup -y --no-progress
      - shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: FormatWheel-Setup
          path: dist/*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
      - name: Publish SDK to nuget.org
        if: startsWith(github.ref, 'refs/tags/v') && env.NUGET_API_KEY != ''
        shell: pwsh
        run: dotnet nuget push dist/*.nupkg --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
